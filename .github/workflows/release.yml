name: Release

# По тегу вида v1.2.2 собираем MSI и публикуем релиз с ассетом.
# Можно запустить и вручную (Actions -> Release -> Run workflow), указав тег.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для релиза (например, v1.2.2)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX v5 + firewall extension
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:USERPROFILE\.dotnet\tools\wix.exe" extension add --global WixToolset.Firewall.wixext/5.0.2

      # Собираем через MSVC-окружение + Ninja, а не через генератор "Visual Studio NN YYYY":
      # на windows-latest версия VS меняется, и генератор может быть неизвестен CMake
      # (CMake Error: could not find any instance of Visual Studio).
      # CMake держим 3.x: LibVNCServer 0.9.14 (cmake_minimum_required < 3.5) под CMake 4.x не идёт.
      - name: Pin CMake 3.x + Ninja
        shell: pwsh
        run: |
          python -m pip install --quiet --disable-pip-version-check "cmake==3.29.6" "ninja==1.11.1.1"
          $scripts = (python -c "import sysconfig; print(sysconfig.get_path('scripts'))").Trim()
          $cmake = Join-Path $scripts 'cmake.exe'
          $ninja = Join-Path $scripts 'ninja.exe'
          if (-not (Test-Path $cmake)) { throw "cmake не найден: $cmake" }
          if (-not (Test-Path $ninja)) { throw "ninja не найден: $ninja" }
          "CMAKE_EXE=$cmake" | Out-File -FilePath $env:GITHUB_ENV -Append
          # ninja кладём в PATH: иначе CMake не находит его для генератора Ninja
          $scripts | Out-File -FilePath $env:GITHUB_PATH -Append
          & $cmake --version | Select-Object -First 1
          & $ninja --version

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build agent (CMake + Ninja + MSVC)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vs = (& $vswhere -all -products * -property displayName) -join '; '
            Write-Host "::notice::Visual Studio: $vs"
          }
          Write-Host "::notice::cl: $((Get-Command cl.exe -ErrorAction SilentlyContinue).Source)"

          ninja --version
          & $env:CMAKE_EXE -S src/Agent -B build/agent -G Ninja -DCMAKE_BUILD_TYPE=Release 2>&1 |
            Tee-Object -FilePath cfg.log
          if ($LASTEXITCODE -ne 0) {
            $err = (Select-String -Path cfg.log -Pattern 'CMake Error' -Context 0, 10 |
                    Select-Object -First 2 |
                    ForEach-Object { @($_.Line) + @($_.Context.PostContext) }) -join '%0A'
            if (-not $err) { $err = ((Get-Content cfg.log -Tail 25) -join '%0A') }
            Write-Host "::error title=cmake configure failed::$err"
            exit 1
          }

          & $env:CMAKE_EXE --build build/agent 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            $err = (Select-String -Path build.log -Pattern 'error C|error MSB|fatal error|ninja: build stopped' -Context 0, 3 |
                    Select-Object -First 4 |
                    ForEach-Object { @($_.Line) + @($_.Context.PostContext) }) -join '%0A'
            if (-not $err) { $err = ((Get-Content build.log -Tail 25) -join '%0A') }
            Write-Host "::error title=agent build failed::$err"
            exit 1
          }

          Get-Item build/agent/RemoteControlAgent.exe | ForEach-Object { "агент: $($_.FullName) ($($_.Length) байт)" }

      # Агент не должен тянуть чужие DLL (например, libcrypto-3-x64.dll из OpenSSL):
      # их нет на целевой машине, служба не стартует и MSI падает с Error 1920.
      - name: Verify agent has no foreign DLL dependencies
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vs = & $vswhere -latest -products * -property installationPath
          $dumpbin = Get-ChildItem (Join-Path $vs 'VC\Tools\MSVC') -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like '*Hostx64\x64*' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin не найден' }

          $deps = (& $dumpbin.FullName /dependents 'build/agent/RemoteControlAgent.exe') |
              Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }
          $deps | ForEach-Object { Write-Host "  $_" }

          # api-ms-win-* — API-сеты ОС: файлов на диске может не быть, они всё равно системные.
          $system = (Get-ChildItem 'C:\Windows\System32' -Filter '*.dll' | Select-Object -ExpandProperty Name)
          $bad = $deps | Where-Object { $_ -notin $system -and $_ -notlike 'api-ms-win-*' }
          if ($bad) {
            Write-Host "::error title=агент зависит от внешних DLL::$($bad -join ', ') — отключите зависимость LibVNCServer или положите DLL рядом с агентом"
            exit 1
          }
          Write-Host 'зависимости в порядке: только системные DLL'

      - name: Publish viewer (legacy packages)
        shell: pwsh
        continue-on-error: true
        run: |
          dotnet publish src/Viewer/RemoteControl.Viewer/RemoteControl.Viewer.csproj `
            -c Release -r win-x64 --self-contained true -o dist/viewer-sc

      - name: Build single MSI (agent + CA + viewer)
        shell: pwsh
        run: |
          ./installer/build-single-msi.ps1 -AgentExe "$PWD/build/agent/RemoteControlAgent.exe" 2>&1 |
            Tee-Object -FilePath msi.log
          if ($LASTEXITCODE -ne 0) {
            $err = ((Get-Content msi.log -Tail 25) -join '%0A')
            Write-Host "::error title=MSI build failed::$err"
            exit 1
          }

      - name: Build legacy MSIs (optional)
        shell: pwsh
        continue-on-error: true
        run: |
          ./installer/build-msi.ps1 -AgentExe "$PWD/build/agent/RemoteControlAgent.exe" -ViewerPublishDir "$PWD/dist/viewer-sc"

      - name: Collect artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist/msi -Filter *.msi | ForEach-Object {
            "{0,-32} {1,10:N1} MB" -f $_.Name, ($_.Length / 1MB)
          }
          if (-not (Test-Path dist/msi/RemoteControl.msi)) { throw 'RemoteControl.msi не собран' }

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.tag }}' } else { $env:GITHUB_REF_NAME }
          if (-not $tag) { throw 'не удалось определить тег' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "tag: $tag"

      - name: Publish release with MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = '${{ steps.tag.outputs.tag }}'
          $assets = @(Get-ChildItem dist/msi -Filter *.msi | ForEach-Object { $_.FullName })
          $notes = @'
          ## Единый MSI

          `RemoteControl.msi` — один установщик, которого достаточно поставить на сервер.
          Он ставит **агент, автономный мини-CA и консоль оператора** и сразу выпускает
          машинный сертификат агенту — дальше удалённый доступ работает без ручных шагов.

          ```powershell
          msiexec /i RemoteControl.msi /qn /l*v rc-msi.log
          ```

          | Что делает | Детали |
          |---|---|
          | Агент | `RemoteControlAgent.exe` + служба `RemoteControlAgent` (автостарт), брандмауэр TCP 5900 |
          | Мини-CA | `ca\labca.exe`, задача `RemoteControlLabCa` (SYSTEM, at startup), брандмауэр TCP 80/8555 |
          | Машинный сертификат | задача `RemoteControlEnrollMachine` + выпуск сразу при установке |
          | Правила доступа | `ListenPort=5900`, `RequireClientCert=1`, `AllowLocalAdmins=1`, `AllowDomainUsers=1` |
          | Консоль оператора | `C:\Program Files\Remote Control Viewer` + ярлыки |

          **Оператору** (на своей машине): `msiexec /i RemoteControl.msi ADDLOCAL=Viewer`, затем взять
          сертификат у ЦС того сервера, к которому будет подключение:

          ```powershell
          & 'C:\Program Files\RemoteControl\enroll-user.cmd' -CaUrl http://<server>/ -EnrollUrl http://<server>:8555/
          ```

          Подробная инструкция — `docs/INSTALL.md`.

          > ⚠️ По умолчанию включён `AllowDomainUsers=1`: подключаться сможет любой пользователь домена.
          > Сузить доступ: `scripts\configure-agent.ps1 -AllowedGroups @("CN=...") -AllowDomainUsers $false`.
          '@
          $notes | Out-File -FilePath release-notes.md -Encoding utf8

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @assets --clobber
          } else {
            gh release create $tag @assets --title "Remote Control $tag" --notes-file release-notes.md
          }
          if ($LASTEXITCODE -ne 0) { throw "не удалось опубликовать релиз $tag" }
          gh release view $tag --json tagName,assets --jq '.tagName + " -> " + ([.assets[].name] | join(", "))'
